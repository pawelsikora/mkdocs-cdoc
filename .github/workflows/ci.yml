name: CI Pipeline for Cross-References & Symbol Registry

on:
  push:
    branches: [ main, feature/GROUP2_Cross-References-Symbol-Registry ]
  pull_request:
    branches: [ main, feature/GROUP2_Cross-References-Symbol-Registry ]

env:
  PYTHON_VERSION_DEFAULT: "3.11"

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install mypy

      - name: Run Flake8
#        continue-on-error: true
        run: |
          echo "Checking code style with Flake"
          flake8 mkdocs_cdoc/ tests/ --max-line-length=120 --show-source

      - name: Run Pylint
        continue-on-error: true
        run: |
          echo "Checking code quality with Pylint"
          pylint mkdocs_cdoc/plugin.py --fail-under=5.0
#          pylint mkdocs_cdoc/ --exit-zero

      - name: Run Mypy
        continue-on-error: true
        run: |
          echo "Checking types with Mypy"
          mypy --strict mkdocs_cdoc/plugin.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pytest-cov

      - name: Run Symbol Registry Tests
#        continue-on-error: true
        run: |
          echo "=== TestSymbolRegistry: Symbol indexing and resolution ==="
          pytest tests/test_cdoc.py::TestSymbolRegistry -v --tb=short

      - name: Run Cross-Reference Resolution Tests
#        continue-on-error: true
        run: |
          echo "=== TestXrefResolution: reST roles, auto-linking, backticks ==="
          pytest tests/test_cdoc.py::TestXrefResolution -v --tb=short

      - name: Run File Cross-References Tests
#        continue-on-error: true
        run: |
          echo "=== TestFileXref: Cross-references between source groups ==="
          pytest tests/test_cdoc.py::TestFileXref -v --tb=short

      - name: Run all tests
#        continue-on-error: true
        run: |
          echo "=== Running all tests ==="
          pytest tests/test_cdoc.py -v --tb=short

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pytest-cov

      - name: Generate Coverage Report (Area 3 Tests)
#        continue-on-error: true
        run: |
          echo "Generating coverage report for tests"
          pytest tests/test_cdoc.py::TestSymbolRegistry \
                  tests/test_cdoc.py::TestXrefResolution \
                  tests/test_cdoc.py::TestFileXref \
            --cov=mkdocs_cdoc \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=json \
            --cov-report=xml \
            -v

      - name: Display Coverage Summary
#        continue-on-error: true
        run: |
          echo "Coverage Summary"
          python -c "
          import json
          try:
              with open('coverage.json') as f:
                  data = json.load(f)
                  pct = data['totals']['percent_covered']
                  covered = data['totals']['covered_lines']
                  total = data['totals']['num_statements']
                  print(f'Overall Coverage: {pct:.1f}%')
                  print(f'Lines Covered: {covered}/{total}')
                  if pct >= 70:
                      print('Coverage is good (≥70%)')
                  elif pct >= 50:
                      print('Coverage acceptable (≥40%)')
                  else:
                      print('Coverage is low (<40%)')
          except Exception as e:
              print(f'Error: {e}')
          "

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
        if: always()

  build:
    name: Build Validation (MkDocs)
    runs-on: ubuntu-latest
    needs: coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install mkdocs

      - name: Build Documentation
        continue-on-error: true
        run: |
          echo "=== Building MkDocs documentation ==="
          cd example
          mkdocs build --strict -f mkdocs.yml

      - name: Verify Build Output
        continue-on-error: true
        run: |
          echo "=== Verifying documentation build ==="
          if [ -d "example/site" ]; then
            echo "Documentation site generated"
            TOTAL_FILES=$(find example/site -type f | wc -l)
            echo "Total files: $TOTAL_FILES"
          else
            echo "Site directory not found"
            exit 1
          fi

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: example/site/
        if: always()

  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint, test, coverage, build]
    if: always()

    steps:
      - name: Check Pipeline Success
        run: |
          echo "=== Pipeline Status Check ==="
          
          if [ "${{ needs.lint.result }}" = "failure" ]; then
            echo "Lint FAILED"
            exit 1
          fi
          
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "Tests FAILED"
            exit 1
          fi
          
          if [ "${{ needs.coverage.result }}" = "failure" ]; then
            echo "Coverage FAILED"
            exit 1
          fi
          
          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "Build FAILED"
            exit 1
          fi
          
          echo "!!Pipeline PASSED!! All stages successful!"