name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Static analysis with pylint
        run: pylint mkdocs_cdoc/ --disable=C0114,C0115,C0116,R0903,R0913,R0914,R0915,C0301,W0511 --fail-under=7.0

      - name: Static analysis with flake8
        run: flake8 mkdocs_cdoc/ --count --max-line-length=120 --extend-ignore=E203 --statistics

      - name: Run unit and integration tests
        run: pytest tests/ -v

      - name: Generate coverage report
        run: pytest --cov=mkdocs_cdoc --cov-report=term-missing tests/

      - name: Build validation
        run: |
          cd example
          mkdocs build
